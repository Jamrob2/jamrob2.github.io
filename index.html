<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Budget Meal Planner</title>
<meta name="description" content="Plan a week of meals under your grocery budget, with a priced grocery list, store comparison and freezer tracking.">
<meta name="theme-color" content="#16351f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3ef;--card:#ffffff;--ink:#14281c;--muted:#66706a;--line:#e4e2da;
  --brand:#16351f;--brand-2:#eaf0e6;--lime:#ddf75b;--accent:#e8833a;--warn:#c2410c;--warn-bg:#fff1e6;
  --p:#2f7d55;--c:#d99a1e;--f:#c2566b;--radius:18px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111511;--card:#1a201b;--ink:#eef2ef;--muted:#98a29c;--line:#2a322c;
  --brand:#ddf75b;--brand-2:#26301d;--lime:#ddf75b;--accent:#f0a060;--warn:#fb923c;--warn-bg:#33231a;
  --p:#5cc28b;--c:#e8b84a;--f:#e47b90;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:110px;resize:vertical}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:#fff;font-weight:700}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--muted)}
.grow{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;width:38px;height:38px;display:grid;place-items:center}
.pill{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--brand-2);color:var(--brand);font-weight:600}
main{max-width:760px;margin:0 auto;padding:14px 14px 100px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:760px;width:100%}
nav button{flex:1;border:0;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);font-weight:600}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 13px;font-weight:600;font-size:14px}
.btn.pri{background:var(--lime);border-color:var(--lime);color:#14281c;border-radius:99px}
.btn.big{width:100%;padding:16px;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.logo{background:var(--lime)!important;color:#14281c!important;font-style:italic}
.chip.on{background:var(--brand)!important;border-color:var(--brand)!important;color:var(--bg)!important}
.budget{background:var(--brand);color:#fff;border:0}
@media (prefers-color-scheme:dark){.budget{background:var(--brand-2)}}
.budget .t{height:8px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:8px}
.budget .t i{display:block;height:100%;background:var(--lime);border-radius:9px}
.budget .t i.over{background:#ff8a65}
.swap{border:1px solid var(--line);background:var(--card);border-radius:99px;width:34px;height:34px;flex:none;font-size:15px}
.price{border:0;background:none;padding:0;font-weight:600;font-size:13px;color:var(--ink);text-decoration:underline dotted;text-underline-offset:3px}
.chips.goals{gap:8px}
.chip.goal{padding:10px 15px;font-size:15px;font-weight:600;background:var(--card);border-color:var(--card);box-shadow:0 1px 0 var(--line)}
.chip.goal span{font-size:18px;margin-right:2px}
.chip.goal.on{background:var(--brand)!important;color:var(--bg)!important}
.chip.tri.like{background:var(--brand-2);border-color:var(--p);color:var(--p)}
.chip.tri.dis{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);text-decoration:line-through}
.shopitem{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:14px 2px;font-size:18px}
.shopitem:first-child{border-top:0}
.shopitem .box{width:28px;height:28px;border:2px solid var(--brand);border-radius:8px;flex:none;display:grid;place-items:center;font-weight:700;color:var(--brand)}
.shopitem .muted{font-size:14px}
.shopitem.done{opacity:.5;font-size:15px;padding:10px 2px}
.swap:disabled{opacity:.3}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px}
.toggle input{width:22px;height:22px;accent-color:var(--brand);flex:none}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--warn)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:20px;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--muted)}
.day h3{margin:0;font-size:16px}
.slot{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
.slot:first-of-type{border-top:0}
.slot .lab{width:72px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.slot .meal{flex:1;text-align:left;border:0;background:none;padding:0;min-width:0}
.slot .meal .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .meal .meta{font-size:12px;color:var(--muted)}
.add{color:var(--brand);font-weight:600}
.warnic{color:var(--warn);font-size:12px;font-weight:600}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grid5 .stat{padding:8px}
.grid5 .stat b{font-size:16px}
.bar{font-size:11px;color:var(--muted)}
.bar .t{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:4px}
.bar .t i{display:block;height:100%;border-radius:9px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:var(--brand-2);color:var(--brand);font-weight:600;margin-right:4px}
.tag.w{background:var(--warn-bg);color:var(--warn)}
.macros{display:flex;gap:10px;font-size:12px;color:var(--muted)}
.macros b{color:var(--ink);font-weight:600}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 4px 8px}
.gitem{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line)}
.gitem:first-of-type{border-top:0}
.gitem input{width:22px;height:22px;accent-color:var(--brand);flex:none}
.gitem.done .gn{text-decoration:line-through;color:var(--muted)}
.gq{margin-left:auto;font-weight:600;font-size:13px;white-space:nowrap}
.rcard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.emoji{font-size:26px;width:44px;height:44px;border-radius:12px;background:var(--brand-2);display:grid;place-items:center;flex:none}
.muted{color:var(--muted)}
.small{font-size:12.5px}
ol.steps{padding-left:20px;margin:6px 0}
ol.steps li{margin:4px 0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0 0 4px;font-size:19px}
.field{margin:10px 0}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.session{border-left:4px solid var(--accent)}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
details summary{cursor:pointer;font-weight:600;color:var(--brand);font-size:13px;margin-top:8px}
</style>
</head>

<nav><div class="in">

</div></nav>
<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>

const weekStart=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const spentThisWeek=()=>(S.purchases||[]).filter(p=>p.ts>=weekStart()).reduce((a,p)=>a+(+p.paid||0),0);
function parseQty(q,unit){ // "12 x 355 mL" / "1 kg" / "500 g" / "4 L" / "12" -> amount in the ingredient's unit
  if(!q)return null;const s=String(q).toLowerCase().replace(',', '.');
  let mult=1;const mm=s.match(/(\d+)\s*[x×]\s*/);if(mm)mult=+mm[1];
  const m=s.replace(/(\d+)\s*[x×]\s*/,'').match(/([\d.]+)\s*(kg|g|ml|l|cl|lb|oz)?/);if(!m)return null;
  let v=parseFloat(m[1])*mult,u=m[2]||'';
  if(u==='kg'){v*=1000;u='g'}else if(u==='lb'){v*=453.6;u='g'}else if(u==='oz'){v*=28.35;u='g'}else if(u==='l'){v*=1000;u='ml'}else if(u==='cl'){v*=10;u='ml'}
  if(unit==='g'&&u==='g'||unit==='ml'&&u==='ml')return Math.round(v);
  if(unit==='g'&&u==='ml'||unit==='ml'&&u==='g')return Math.round(v);
  if(!u&&!['g','ml'].includes(unit))return v;
  return null;
}
function matchIngredients(name){
  const words=String(name||'').toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).filter(w=>w.length>2);
  const keys=ingredientKeys();
  return keys.map(([k,v])=>{const iw=v.n.toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).filter(w=>w.length>2);
    let sc=0;iw.forEach(w=>{if(words.some(x=>x===w||x.startsWith(w.slice(0,5))||w.startsWith(x.slice(0,5))))sc+=w.length});return {k,v,sc:sc/Math.max(4,iw.join('').length),raw:sc}})
    .filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc||b.raw-a.raw).slice(0,6);
}
async function lookupBarcode(code){
  const mem=(S.barcodes||{})[code];if(mem)return {...mem,known:true};
  try{const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,quantity`);
    if(!r.ok)return null;const j=await r.json();if(!j||!j.product||!j.product.product_name)return null;
    return {name:[j.product.brands&&j.product.brands.split(',')[0],j.product.product_name].filter(Boolean).join(' '),qty:j.product.quantity||'',off:true}}catch(e){return null}
}

  <div class="row" style="margin-top:8px"><label class="btn grow" style="text-align:center">📸 Photo of barcode<input id="scfile" type="file" accept="image/*" capture="environment" style="display:none"></label></div>

async function purchaseSheet(code){

        <div class="small muted">Make ${e.make} serving${e.make>1?'s':''} (${scale===1?'1×':'×'+(Math.round(scale*100)/100)} recipe) · ${e.r.time} min</div>${xtra>0?`<div class="small" style="color:var(--p);font-weight:600">🧊 ${xtra} extra serving${xtra>1?'s':''} for the freezer</div>`:''}</div></div>
        <div style="margin-top:8px"><span class="tag">Eat: ${days}</span><span class="tag">Fridge ${e.r.fridge}d</span>${e.warn?'<span class="tag w">Freeze late-week portions</span>':''}</div>
        <details><summary>Ingredients & steps</summary>

function priceSheet(i){

function storeGroups(items){
  if(!splitOn()) return [[S.store,items]];
  const g={};items.forEach(i=>{const st=i.store||myStores()[0];(g[st]=g[st]||[]).push(i)});
  return myStores().filter(st=>g[st]).map(st=>[st,g[st]]);
}
function compareCard(buy){
  const sts=myStores(); if(sts.length<2) return `<button class="rcard" id="cmpset"><div class="emoji">🏪</div><div class="grow"><b>Compare stores</b><div class="small muted">Add the stores you shop at to see where this week is cheapest.</div></div>›</button>`;
  const priced=buy.filter(i=>i.by&&Object.keys(i.by).length);
  const tot={};sts.forEach(st=>tot[st]=priced.reduce((a,i)=>a+(i.by[st]?i.by[st].cost:0),0));
  const splitTot=priced.reduce((a,i)=>a+Math.min(...Object.values(i.by).map(c=>c.cost)),0);
  const best=sts.slice().sort((a,b)=>tot[a]-tot[b])[0];
  const own=priced.filter(i=>sts.some(st=>ownPrice(i.k,st))).length;
  const nStores=new Set(priced.map(i=>Object.values(i.by).sort((a,b)=>a.cost-b.cost)[0].st)).size;
  return `<div class="card"><div class="row" style="margin-bottom:6px"><b class="grow">🏪 This week at each store</b><button class="btn sm" id="cmpset">Edit stores</button></div>
  ${sts.slice().sort((a,b)=>tot[a]-tot[b]).map(st=>`<div class="row" style="padding:6px 0;border-top:1px solid var(--line)"><span class="grow">${esc(stName(st))}${discPct(st)?` <span class="small muted">(−${discPct(st)}%)</span>`:''}${st===best?' <span class="tag">Cheapest</span>':''}</span><b>${money(tot[st])}</b>
    ${!splitOn()&&st===S.store?'<span class="tag" style="margin-left:6px">Shopping here</span>':`<button class="btn sm" data-usest="${st}" style="margin-left:6px">${splitOn()?'Shop only here':'Shop here'}</button>`}</div>`).join('')}
  <div class="row" style="padding:8px 0 2px;border-top:1px solid var(--line)"><span class="grow"><b>Split between stores</b><div class="small muted">${nStores} store${nStores>1?'s':''} · saves ${money(Math.max(0,tot[best]-splitTot))} vs ${esc(stName(best))}</div></span><b>${money(splitTot)}</b>
    ${splitOn()?'<span class="tag" style="margin-left:6px">On</span>':'<button class="btn sm pri" id="splitgo" style="margin-left:6px">Split</button>'}</div>
  <div class="small muted" style="margin-top:6px">${own?`${own} item${own>1?'s use':' uses'} your own prices; the rest are estimates.`:'All estimates so far. Enter flyer prices for each store (tap a price) to make the comparison real.'}</div></div>`;
}

function pickSheet(d,s){
  const lab=SLOTS.find(x=>x[0]===s)[1];
  const cur=S.plan[key(d,s)];
  let showAll=false;
  const base=weekCost();
  const trial=id=>{const sv=S.plan[key(d,s)];S.plan[key(d,s)]=id;const c=weekCost();if(sv)S.plan[key(d,s)]=sv;else delete S.plan[key(d,s)];return{c,d:c-base}};
  const usedOn=id=>{const ds=[];for(let i=0;i<7;i++)SLOTS.forEach(([x])=>{if(!(i===d&&x===s)&&S.plan[key(i,x)]===id&&!ds.includes(SD[i]))ds.push(SD[i])});return ds.join(', ')};
  const draw=()=>{
    const list=allRecipes().filter(r=>showAll||(r.cat===lab&&allowed(r))).sort((a,b)=>(allowed(b)-allowed(a))||(liked(b)-liked(a)));
    openSheet(`<h2>${DAYS[d]} · ${lab}</h2>
    <div class="row" style="margin:8px 0 12px"><button class="chip ${!showAll?'on':''}" id="c1">${lab} recipes</button><button class="chip ${showAll?'on':''}" id="c2">All recipes</button></div>
    ${list.map(r=>{const t=trial(r.id);return recCard(r,'data-pick',`<div class="small" style="font-weight:600;color:${t.c>S.budget?'var(--warn)':'var(--p)'}">${t.d>=0?'+':'−'}${money(Math.abs(t.d))} to week${t.c>S.budget?' · over budget':''}</div>${usedOn(r.id)?`<span class="tag w">Already on ${usedOn(r.id)}</span>`:''}`)}).join('')||'<div class="empty">No recipes here yet.</div>'}
    <div class="row" style="margin-top:8px">${cur?`<button class="btn danger grow" id="rm">Remove meal</button>${S.noRepeat?'':'<button class="btn grow" id="cpy">Use for rest of week</button>'}`:''}<button class="btn grow" data-close>Close</button></div>`);
    $('#c1').onclick=()=>{showAll=false;draw()};$('#c2').onclick=()=>{showAll=true;draw()};
    document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const u=usedOn(b.dataset.pick);S.plan[key(d,s)]=b.dataset.pick;if(S.frzSlots)delete S.frzSlots[key(d,s)];save();closeSheet();render();const c=weekCost();if(S.noRepeat&&u)toast(`Heads up: this is already planned on ${u}`);else if(c>S.budget)toast(`Heads up: that puts you ${money(c-S.budget)} over budget`)});
    if(cur){$('#rm').onclick=()=>{delete S.plan[key(d,s)];if(S.frzSlots)delete S.frzSlots[key(d,s)];save();closeSheet();render()};
      if($('#cpy'))$('#cpy').onclick=()=>{for(let i=d;i<7;i++)S.plan[key(i,s)]=cur;save();closeSheet();render();toast(`${lab} set through Sunday`)}}
  };
  draw();
}

function ingToText(ing){return ing.map(([n,q,u,a])=>`${+q.toFixed(2)} ${u} ${n}${a?' | '+a:''}`).join('\n')}
function parseIng(txt){
  return txt.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    let [main,aisle]=l.split('|').map(x=>x.trim());
    const m=main.match(/^([\d.,/]+)\s*([a-zA-Z]+)?\s+(.*)$/);
    let q=1,u='pc',n=main;
    if(m){
      q=m[1].includes('/')?m[1].split('/').reduce((a,b)=>a/b):parseFloat(m[1].replace(',','.'))||1;
      const uu=(m[2]||'').toLowerCase().replace(/s$/,'');
      if(UNITS.includes(uu)){u=uu;n=m[3]}else{n=((m[2]||'')+' '+m[3]).trim()}
      if(u==='kg'){u='g';q*=1000} if(u==='l'){u='ml';q*=1000}
    }
    const al=AISLES.find(a=>aisle&&a.toLowerCase().startsWith(aisle.toLowerCase()));
    return [n,q,u,al||guessAisle(n)];
  });
}
function guessAisle(n){n=n.toLowerCase();
  if(/chicken|beef|turkey|pork|salmon|fish|shrimp|tuna|ham|bacon|sausage/.test(n))return 'Meat & Fish';
  if(/milk|cheese|yogurt|egg|butter|cream|feta|parmesan|cheddar/.test(n))return 'Dairy & Eggs';
  if(/bread|tortilla|pita|bun|bagel|wrap/.test(n))return 'Bakery';
  if(/frozen/.test(n))return 'Frozen';
  if(/sauce|salsa|seasoning|powder|spice|pepper flakes|oregano|cumin|paprika|soy|dressing|vinegar/.test(n))return 'Spices & Sauces';
  if(/rice|pasta|oat|bean|lentil|flour|sugar|oil|honey|can|nut|seed|stock|broth/.test(n))return 'Pantry';
  if(/onion|garlic|pepper|carrot|lettuce|spinach|broccoli|potato|tomato|lemon|lime|apple|banana|berr|zucchini|cucumber|herb|cilantro|parsley|kale/.test(n))return 'Produce';
  return 'Other'}

/* ---------- Storage (Claude account sync, browser fallback) ---------- */
const LS='batch-mealprep-v1';
let db=null, ref=null, writing=false, dirty=false, wTimer=null;
function normalize(x){const d=defaultState();const o=(!x||typeof x!=='object')?d:{...d,...x,goals:{...d.goals,...(x.goals||{})}};
  if(!o.pantry){o.pantry={};Object.entries(PRICES).forEach(([k,v])=>{if(v[2])o.pantry[k]=1})}
  if(!Array.isArray(o.slots)||!o.slots.length)o.slots=['B','L','D','S'];
  if(typeof o.noRepeat!=='boolean')o.noRepeat=true;
  if(!o.goals.na)o.goals.na=2300;
  o.freezer=o.freezer||[];o.frzSlots=o.frzSlots||{};o.history=o.history||[];o.fullBatch=!!o.fullBatch;o.shop=!!o.shop;o.swaps=o.swaps||{};o.storeBrand=!!o.storeBrand;o.deals=o.deals||[];o.purchases=o.purchases||[];o.barcodes=o.barcodes||{};o.discounts=o.discounts||{};o.leftoverLunch=!!o.leftoverLunch;
  return o}
function onboard(){
  let people=S.people||1, sl=new Set(S.slots||['B','L','D','S']);
  openSheet(`<div style="text-align:center;padding:10px 0 4px"><div class="logo" style="width:56px;height:56px;margin:0 auto 10px;border-radius:16px;display:grid;place-items:center;font-size:28px;font-weight:700">$</div>
  <h2 style="font-size:24px">Let's plan your week</h2><p class="muted" style="margin:6px 0 0">Tell me where you shop, your budget and who's eating. I'll plan a week you can batch-cook, plus the grocery list with the total worked out.</p></div>

  <div class="sec-title">Weekly grocery budget</div>
  <div class="row"><span style="font-size:22px;font-weight:700">$</span><input id="ob" type="number" min="10" step="5" value="${S.budget}" style="font-size:20px;font-weight:700"></div>
  <div class="sec-title">How many people?</div>
  <div class="chips">${[1,2,3,4,5,6].map(n=>`<button class="chip ${people===n?'on':''}" data-op="${n}">${n}</button>`).join('')}</div>
  <div class="sec-title">Which meals?</div>
  <div class="chips">${SLOTS.map(([s,l])=>`<button class="chip ${sl.has(s)?'on':''}" data-os="${s}">${l}</button>`).join('')}</div>
  <div style="margin-top:22px"><button class="btn pri big" id="ogo">Next: your tastes ›</button></div>
  <div style="text-align:center;margin-top:10px"><button class="btn sm" style="border:0;background:none" id="oskip">I'll plan it myself</button></div>`);
  document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{people=+b.dataset.op;document.querySelectorAll('[data-op]').forEach(x=>x.classList.toggle('on',+x.dataset.op===people))});
  document.querySelectorAll('[data-os]').forEach(b=>b.onclick=()=>{const s=b.dataset.os;sl.has(s)?sl.delete(s):sl.add(s);if(!sl.size)sl.add(s);b.classList.toggle('on',sl.has(s))});
  const done=plan=>{S.store=$(".storesel").value;S.budget=Math.max(10,parseFloat($("#ob").value)||180);S.people=people;S.slots=SLOTS.map(x=>x[0]).filter(s=>sl.has(s));S.onboarded=true;closeSheet();tab='plan';if(plan)tasteSheet(()=>autoFill());else{save();render()}};
  $('#ogo').onclick=()=>done(true); $('#oskip').onclick=()=>done(false);
}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function loadLocal(){try{const t=localStorage.getItem(LS);return t?JSON.parse(t):null}catch(e){return null}}
function save(){syncLunch();saveLocal();if(ref){dirty=true;clearTimeout(wTimer);wTimer=setTimeout(flush,700)}}
async function flush(){
  if(!ref||writing||!dirty) return;
  writing=true;dirty=false;setSync('Saving…');
  try{await ref.set({json:JSON.stringify(S),updated:Date.now()});setSync('Synced')}
  catch(e){setSync('Offline');dirty=true}
  writing=false; if(dirty) wTimer=setTimeout(flush,1500);
}
function setSync(t){const p=$('#sync');p.textContent=t;p.style.display=t==='Local'?'none':''}
async function initSync(){
  try{
    if(!window.claude||typeof window.claude.use!=='function'){setSync('Local');return}
    const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!d||!u){setSync('Local');return}
    const uid=await u.id(); if(!uid){setSync('Local');return}
    const r=d.collection('data/users/'+uid).doc('mealprep');
    const snap=await Promise.race([r.get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000))]);
    let val=snap&&typeof snap.data==='function'?snap.data():snap;
    if(val&&val.data&&!val.json&&typeof val.data==='object')val=val.data;
    db=d;ref=r;
    if(val&&val.json){S=normalize(JSON.parse(val.json));saveLocal();render();setSync('Synced')}
    else{dirty=true;flush()}
  }catch(e){setSync('Local')}
}

/* ---------- Boot ---------- */
S=normalize(loadLocal());
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;window.scrollTo(0,0);render()});
$('#gear').onclick=settingsSheet;
render();
if(!S.onboarded) onboard();
initSync();
loadFeed();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude\.ai|claudeusercontent/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
